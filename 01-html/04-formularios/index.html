<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formulário HTML</title></head><body><main><h1>Inscrição para oficina</h1><form>
<p><label for="nome">Nome:</label><br><input id="nome" name="nome" required minlength="2"></p>
<p><label for="email">E-mail:</label><br><input id="email" name="email" type="email" required></p>
<p><label for="area">Área:</label><br><select id="area" name="area"><option>HTML</option><option>CSS</option><option>JavaScript</option></select></p><button type="submit">Enviar (demonstração)</button>
</form></main></body></html>
